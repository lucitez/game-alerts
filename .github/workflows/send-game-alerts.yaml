name: Send Game Alerts
on:
  schedule:
    # This runs every day at 17:00 UTC (9am pacific)
    - cron: '0 17 * * *'
  push:
    branches:
      - main
      - test-action
permissions:
  contents: write
jobs:
  send-game-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup go
        uses: actions/setup-go@v7
        with: 
          go-version-file: 'go.mod'
      - name: Install dependencies
        run: go install .
      - name: Run game alerts script
        run: go run . | tee output.txt | jq . && exit ${PIPESTATUS[0]}
        env:
          ENV: prod
          SFTP_EMAIL: ${{ secrets.SFTP_EMAIL }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add internal/database/send_history.json
          git diff --staged --quiet || git commit -m "Update history log $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push
      - name: Send logs to aggregator
        if: always()
        run: echo "TODO"
              
